<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#c9c2b0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="點陣風格的台灣散步小遊戲，單機版。">
  <title>樂園</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="game/game.css?v=36e668e161">
</head>
<body class="phone">
<div class="shell" id="shell">
  <div class="bezel">
    <div class="bezel-top"><i></i><span>樂園 PARADISE</span><i></i></div>
    <div class="screen" id="screen">
      <canvas id="game" aria-label="遊戲畫面"></canvas>
      <div class="labels" id="labels"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="toast" id="toast" hidden role="status"></div>
      <div class="ui" id="ui" hidden></div>
      <div class="offline" id="offline" hidden>重新連線中…</div>
    </div>
  </div>
  <div class="pad">
    <div class="dpad" id="dpad" aria-label="方向鍵">
      <b class="up">▲</b><b class="left">◀</b><b class="mid"></b><b class="right">▶</b><b class="down">▼</b>
    </div>
    <div class="ab">
      <button class="b" data-k="b" aria-label="B">B</button>
      <button class="a" data-k="a" aria-label="A">A</button>
    </div>
    <div class="ss">
      <button data-k="select">SELECT</button>
      <button data-k="start">START</button>
    </div>
  </div>
</div>
<div class="sheet" id="sheet" hidden></div>
<script>window.PARADISE_WORLD = "world.json?v=36e668e161";</script>
<script src="game/art.js?v=36e668e161"></script>
<script src="game/art_more.js?v=36e668e161"></script>
<script src="game/art_world.js?v=36e668e161"></script>
<script src="game/art_landmark.js?v=36e668e161"></script>
<script src="game/engine.js?v=36e668e161"></script>
<script src="game/shaft.js?v=36e668e161"></script>
<script src="game/local.js?v=36e668e161"></script>
<script src="game/phone.js?v=36e668e161"></script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
</html>
